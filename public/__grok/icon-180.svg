<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base redondeada con gradiente institucional TributoApp Teal -->
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)"/>
  
  <!-- Borde sutil brillante -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.25" stroke="#2DD4BF" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Documento / Factura estilizada con checkmark de conciliación -->
  <g filter="url(#glow)">
    <!-- Hoja de Factura -->
    <path d="M7 6.5C7 5.67 7.67 5 8.5 5H18.5L24 10.5V24.5C24 25.33 23.33 26 22.5 26H8.5C7.67 26 7 25.33 7 24.5V6.5Z" fill="#FFFFFF"/>
    <!-- Doblez de la esquina superior derecha -->
    <path d="M18 5V11H24L18 5Z" fill="#CBD5E1"/>
    
    <!-- Líneas de la factura -->
    <rect x="10" y="10" width="5" height="1.5" rx="0.75" fill="#94A3B8"/>
    <rect x="10" y="13.5" width="9" height="1.5" rx="0.75" fill="#94A3B8"/>
    
    <!-- Círculo de aprobación / conciliación DIAN -->
    <circle cx="17.5" cy="19.5" r="5.5" fill="#10B981"/>
    <!-- Checkmark blanco en relieve -->
    <path d="M14.8 19.5L16.6 21.3L20.2 17.7" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
